[package]
name = "schedule-calendar"
version = "1.0.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
notify = "8"
flate2 = "1"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
lunar-lite = "1.3"
rune = { version = "0.14", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
ultra-bar-native-ui = { path = "../../ultra-bar/crates/native-ui" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Storage_Xps", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
debug = 0
codegen-units = 4
incremental = true

[profile.release]
debug = 1
