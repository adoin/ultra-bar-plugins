[package]
name = "agent-usage"
version = "1.0.0"
edition = "2024"
[dependencies]
anyhow = "1"
notify = "8"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ultra-bar-plugin-ui = { path = "../../ultra-bar/crates/plugin-ui" }
ultra-bar-native-ui = { path = "../../ultra-bar/crates/native-ui" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_System_Threading"] }

[profile.release]
debug = 1
