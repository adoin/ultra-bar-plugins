name: Release plugin
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag; leave empty for build-only validation'
        required: false
      plugin_id:
        description: 'Plugin id for build-only validation'
        required: false
        default: 'com.emssion.schedule-calendar'
permissions:
  contents: write
concurrency:
  group: plugin-release-${{ github.event.inputs.tag || github.event.inputs.plugin_id || github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ultra-bar-plugins
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve SDK revision
        id: sdk
        shell: pwsh
        run: |
          $revision = (Get-Content ultra-bar-plugins/sdk-revision.txt -Raw).Trim()
          if ($revision -notmatch '^[a-f0-9]{40}$') { throw 'Invalid pinned SDK revision' }
          "revision=$revision" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: adoin/ultra-bar
          path: ultra-bar
          ref: ${{ steps.sdk.outputs.revision }}
          persist-credentials: false
      - name: Validate tag and toolchain
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and -not '${{ github.event.inputs.tag }}') {
            $pluginId = '${{ github.event.inputs.plugin_id }}'
            $releaseTag = ''
          } else {
            if ($env:RELEASE_TAG -notmatch '^([a-z][a-z0-9.-]+)/v(.+)$') { throw 'Invalid plugin release tag' }
            $pluginId = $Matches[1]
            $releaseTag = $env:RELEASE_TAG
            git -C ultra-bar-plugins rev-parse --verify "refs/tags/$releaseTag"
            if ($LASTEXITCODE -ne 0) { throw 'Tag does not exist' }
            $tagCommit = git -C ultra-bar-plugins rev-parse "refs/tags/$releaseTag^{commit}"
            $headCommit = git -C ultra-bar-plugins rev-parse HEAD
            if ($tagCommit -ne $headCommit) { throw 'Checked-out source is not the requested tag commit' }
          }
          if ($pluginId -notmatch '^[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*){2,}$') { throw 'Invalid plugin id' }
          "PLUGIN_ID=$pluginId" >> $env:GITHUB_ENV
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Test native plugin
        shell: pwsh
        run: |
          $manifest = Get-ChildItem ultra-bar-plugins -Filter plugin.json -Recurse -File | Where-Object { (Get-Content $_.FullName -Raw | ConvertFrom-Json).id -eq $env:PLUGIN_ID } | Select-Object -First 1
          if (-not $manifest) { throw 'Plugin id not found' }
          $cargo = Join-Path $manifest.Directory.FullName 'Cargo.toml'
          if (Test-Path -LiteralPath $cargo) { cargo test --locked --manifest-path $cargo --jobs 1; if ($LASTEXITCODE -ne 0) { throw 'Plugin tests failed' } }
      - name: Build and package release
        shell: pwsh
        run: |
          ./ultra-bar-plugins/scripts/package-plugin.ps1 -PluginId $env:PLUGIN_ID -Tag $env:RELEASE_TAG -OutputDirectory (Join-Path $PWD 'release-output')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugin-${{ env.PLUGIN_ID }}-${{ github.sha }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = '${{ github.repository }}'
          gh release view $env:RELEASE_TAG --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; publish a new version instead of replacing assets' }
          $extra = @()
          $version = ($env:RELEASE_TAG -split '/v')[-1]
          if (($version -split '\+')[0] -match '-') { $extra += '--prerelease' }
          gh release create $env:RELEASE_TAG --repo $repo --verify-tag --title "$env:PLUGIN_ID $env:RELEASE_TAG" --generate-notes @extra (Get-ChildItem release-output -File).FullName
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
